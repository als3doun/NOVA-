<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NOVA | نوفا لتنظيم الحياة</title>
<meta name="theme-color" content="#4a6b57"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f4ec;--sf:#fffdf8;--tx:#24302a;--mu:#7b857e;--ln:#e6e1d3;--ac:#4a6b57;--ac2:#b08d57;--sh:0 1px 3px rgba(40,50,40,.06),0 8px 24px rgba(40,50,40,.04)}
:root[data-theme=dark]{--bg:#161b18;--sf:#1f2622;--tx:#e8ece6;--mu:#98a39b;--ln:#2e3832;--ac:#8fb59f;--ac2:#d1ad76;--sh:0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0}html,body{min-height:100%}
body{font-family:'IBM Plex Sans Arabic',Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;display:flex;font-size:15px}
#side{width:232px;position:sticky;top:0;align-self:flex-start;height:100dvh;padding:22px 14px;border-inline-end:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.brand{font-size:22px;font-weight:600;color:var(--ac);padding:0 10px 18px;letter-spacing:.5px}.brand small{display:block;font-size:12px;color:var(--mu);font-weight:400;letter-spacing:0}
#nav{display:flex;flex-direction:column;gap:2px}#nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--mu);transition:.2s}
#nav a i{font-style:normal;width:20px;text-align:center}#nav a:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}#nav a.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600}
#main{flex:1;min-width:0;padding:28px 34px 60px;max-width:1180px}.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}h1{font-size:26px;font-weight:600}h3{font-size:16px;font-weight:600;margin-bottom:10px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:var(--sh)}.mt{margin-top:16px}.cen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
small,.mu{color:var(--mu);font-size:12.5px}.em{color:var(--mu);padding:14px 0;text-align:center}.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:8px 15px;transition:.2s}.pb{background:var(--ac);color:var(--bg);font-weight:500}.pb:hover{opacity:.88}
.gb{background:transparent;border:1px solid var(--ln);color:var(--tx)}.gb:hover{border-color:var(--ac)}.rd{color:#b5503f}.ib{background:var(--sf);border:1px solid var(--ln);width:36px;padding:6px;color:var(--tx)}.lk{background:none;color:var(--ac);padding:4px 2px;font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 40%,transparent)}
.tr{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--ln)}.tr:last-child{border:0}.tb{flex:1;min-width:0;cursor:pointer}.tb b{font-weight:500;display:block}.tb small{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.dn .tb b{text-decoration:line-through;color:var(--mu)}.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);background:none;padding:0;color:var(--bg);font-size:13px;flex-shrink:0}.dn .ck{background:var(--ac);border-color:var(--ac)}.ck:hover{border-color:var(--ac)}.pop{animation:pp .3s}@keyframes pp{50%{transform:scale(1.35)}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:3px}.bd{font-size:11.5px;padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.bar{height:7px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}.ring{display:block}
.gc{padding:10px 0;cursor:pointer;border-bottom:1px solid var(--ln)}.gc b{display:block;font-weight:500}.kid{padding:3px 14px;font-size:13.5px;color:var(--mu);cursor:pointer}
.seg{display:inline-flex;background:var(--ln);border-radius:12px;padding:3px}.sg{background:none;padding:5px 14px;color:var(--mu)}.sg.on{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.bar2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}.nv{display:flex;align-items:center;gap:8px}.nv b{min-width:150px;text-align:center}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.flt input{flex:1;min-width:160px}.flt select{width:auto}
.wk{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}.wc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px;min-height:190px}.wc.tdy{border-color:var(--ac)}.wh{cursor:pointer;margin-bottom:6px}.wh b{display:block}.wc .tr{padding:7px 0}.wc .bd{display:none}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cgh{text-align:center;color:var(--mu);font-size:12.5px;padding:4px}.cc{background:var(--sf);border:1px solid var(--ln);border-radius:11px;min-height:96px;padding:5px;cursor:pointer;overflow:hidden}.cc.o{opacity:.45}.cc.t{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}.cc>div{display:flex;justify-content:space-between;font-size:12.5px}
.ch{display:block;font-size:11.5px;padding:1px 6px;margin-top:2px;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-inline-start:3px solid var(--c)}.ch.dn{text-decoration:line-through;opacity:.6}
.bk{display:flex;gap:14px}.bk.grid{flex-direction:column}.cov{border-radius:10px;color:#fff;padding:14px;font-weight:600;display:flex;align-items:flex-end;min-height:120px;width:100%;line-height:1.35}.bk.list .cov{width:70px;min-height:90px;font-size:11px;padding:8px;flex-shrink:0}.bk>div{flex:1;min-width:0}.pgi{width:78px;display:inline-block;padding:3px 8px}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:20px;background:var(--ln);margin-inline-end:4px}.sub{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}.sub.d{color:var(--mu);text-decoration:line-through}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:11.5px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px}
.ov{position:fixed;inset:0;background:rgba(20,26,22,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;animation:fd .2s}.sheet{background:var(--sf);border-radius:18px;padding:22px;width:100%;max-width:540px;max-height:90dvh;overflow:auto}.form{display:grid;gap:11px;margin:14px 0}.form label{font-size:13px;color:var(--mu);display:grid;gap:4px}.acts{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;inset-inline:0;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:60}#toast div{background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:30px;pointer-events:auto;display:flex;gap:12px;align-items:center;animation:fd .25s}#toast button{background:none;color:var(--ac2);padding:0}
.nt{min-height:120px;margin-top:6px}
@media(max-width:860px){body{display:block}#main{padding:18px 14px 96px}#side{position:fixed;inset:auto 0 0 0;width:100%;height:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));flex-direction:row;border-top:1px solid var(--ln);background:var(--sf);z-index:30;overflow-x:auto}.brand{display:none}#nav{flex-direction:row}#nav a{flex-direction:column;gap:0;padding:5px 10px;font-size:11px;white-space:nowrap}.cc{min-height:62px}.ch{font-size:10px}.cc>div span:last-child{display:none}.nv b{min-width:110px}}
</style></head><body>
<aside id="side"><div class="brand">NOVA | نوفا<small>لتنظيم الحياة</small></div><nav id="nav"></nav></aside>
<main id="main"></main><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),P2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+P2(d.getMonth()+1)+'-'+P2(d.getDate()),pd=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},ws=d=>add(d,-((d.getDay()+1)%7)),today=()=>ymd(new Date()),dd=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=(d,o)=>new Intl.DateTimeFormat('ar-u-nu-latn',o).format(d),H=(d,o)=>new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',o).format(d);
let D={tasks:[],goals:[],books:[],lects:[],projs:[],skills:[],notes:{},set:{name:'إبراهيم',quote:'خطوة صغيرة كل يوم تصنع فرقًا كبيرًا.',dark:null,cap:360}};
try{const s=localStorage.getItem('nova1');if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
const sv=()=>{try{localStorage.setItem('nova1',JSON.stringify(D))}catch(e){}};
const CATS={study:['الدراسة','#5d7f6a'],read:['القراءة','#b08d57'],pharm:['الصيدلية','#4f7a8c'],hosp:['المستشفى','#a2675c'],self:['التطوير الشخصي','#7d6b99']};
const PRI={high:['عالية','#b5503f'],mid:['متوسطة','#b08d57'],low:['منخفضة','#7a8f80']};
const CT=Object.entries(CATS).map(([k,v])=>[k,v[0]]),PR=Object.entries(PRI).map(([k,v])=>[k,v[0]]);
const COL={task:'tasks',goal:'goals',book:'books',lect:'lects',proj:'projs',skill:'skills'},get=(t,id)=>D[COL[t]].find(x=>x.id==id);
const SCH={
task:[['title','العنوان','text'],['desc','الوصف','area'],['cat','التصنيف','sel',CT],['pri','الأولوية','sel',PR],['date','تاريخ التنفيذ','date'],['time','الوقت','time'],['due','الموعد النهائي','date'],['dur','المدة (دقيقة)','num'],['rep','التكرار','sel',[['','بلا تكرار'],['1','يوميًا'],['7','أسبوعيًا']]],['goal','الهدف المرتبط','goal'],['subs','المهام الفرعية (سطر لكل مهمة)','chk'],['notes','ملاحظات وروابط','area']],
goal:[['title','عنوان الهدف','text'],['level','المستوى','sel',[['year','سنوي'],['month','شهري'],['week','أسبوعي']]],['date','تاريخ ضمن الفترة','date'],['cat','التصنيف','sel',CT],['parent','يتبع الهدف','goal'],['prog','تقدم يدوي % (إن لم تُربط مهام)','num']],
book:[['title','اسم الكتاب','text'],['author','المؤلف','text'],['cat','التصنيف','text'],['pages','عدد الصفحات','num'],['cur','الصفحة الحالية','num'],['start','تاريخ البداية','date'],['end','الموعد المستهدف','date'],['st','الحالة','sel',[['want','أريد قراءته'],['now','أقرؤه حاليًا'],['done','مكتمل'],['pause','متوقف مؤقتًا']]],['notes','ملاحظات القراءة','area']],
lect:[['subj','المادة','text'],['title','عنوان المحاضرة / الوحدة','text'],['total','عدد المحاضرات','num'],['done','المنجز منها','num'],['diff','الصعوبة','sel',[['1','سهلة'],['2','متوسطة'],['3','صعبة']]],['st','الحالة','sel',[['new','لم تبدأ'],['doing','قيد الدراسة'],['rev','تحتاج إلى مراجعة'],['done','مكتملة']]],['date','موعد الدراسة','date'],['rdate','موعد المراجعة','date'],['notes','ملاحظات وأسئلة','area']],
proj:[['title','اسم المشروع','text'],['desc','الوصف والأهداف','area'],['st','الحالة','sel',[['plan','تخطيط'],['run','قيد التنفيذ'],['hold','متوقف'],['done','مكتمل']]],['due','موعد التسليم','date'],['subs','المراحل (سطر لكل مرحلة)','chk'],['notes','ملاحظات','area'],['ideas','أفكار مستقبلية','area']],
skill:[['title','المهارة','text'],['desc','هدف التدريب','area'],['subs','خطوات التعلم / قائمة التحقق','chk'],['review','موضوعات للمراجعة','area'],['notes','ملاحظات تعليمية','area']]};
const DEF={task:{pri:'mid',cat:'study',dur:30},goal:{level:'month',cat:'self'},book:{st:'want'},lect:{st:'new',diff:'2',total:1,done:0},proj:{st:'plan'},skill:{}};
const NAV=[['home','الرئيسية','⌂'],['tasks','مهامي','☑'],['plan','التخطيط الزمني','◫'],['books','الكتب والقراءة','▤'],['lect','المحاضرات والدراسة','✎'],['proj','الصيدلية والمشاريع','⚕'],['hosp','المستشفى والتدريب','✚'],['cal','التقويم','▦'],['stats','الإحصائيات','◔'],['set','الإعدادات','⚙']];
const S={pg:'home',lvl:'week',d:new Date(),F:{q:'',st:'',cat:'',pri:'',view:'list'},bv:'grid',bf:''};
/* helpers */
const open=t=>t.status!='done',key=t=>t.due||t.date||'',late=t=>open(t)&&key(t)&&key(t)<today();
const score=t=>{let s={high:30,mid:20,low:10}[t.pri]||15;if(key(t)){const n=dd(today(),key(t));s+=n<0?40:n<=1?25:n<=3?12:0}if(t.dur&&t.dur<=30)s+=3;return s};
const byd=(a,b)=>key(a).localeCompare(key(b)),byt=(a,b)=>(a.time||'99').localeCompare(b.time||'99')||score(b)-score(a);
const subTP=t=>t.status=='done'?1:(t.subs&&t.subs.length?t.subs.filter(s=>s.d).length/t.subs.length:0);
const gP=g=>{const a=[...D.goals.filter(x=>x.parent==g.id).map(gP),...D.tasks.filter(t=>t.goal==g.id).map(subTP)];return a.length?a.reduce((s,x)=>s+x,0)/a.length:(+g.prog||0)/100};
const sP=x=>x.subs&&x.subs.length?x.subs.filter(s=>s.d).length/x.subs.length:(x.st=='done'?1:0);
const inPer=(g,lv,d)=>{if(g.level!=lv||!g.date)return false;const x=pd(g.date);return lv=='year'?x.getFullYear()==d.getFullYear():lv=='month'?x.getFullYear()==d.getFullYear()&&x.getMonth()==d.getMonth():ymd(ws(x))==ymd(ws(d))};
const inM=(t,y,m)=>{const k=t.date||t.due;if(!k)return false;const x=pd(k);return x.getFullYear()==y&&x.getMonth()==m};
const ring=(p,s=84,c='var(--ac)')=>{const r=s/2-7,C=2*Math.PI*r,h=s/2;return `<svg class="ring" width="${s}" height="${s}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--ln)" stroke-width="7"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 ${h} ${h})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${s/4.4}" fill="var(--tx)" font-weight="600">${Math.round(p*100)}%</text></svg>`};
const bar=(p,c='var(--ac)')=>`<div class="bar"><i style="width:${Math.round(p*100)}%;background:${c}"></i></div>`;
const hdr=(t,a='')=>`<div class="ph"><h1>${t}</h1><div>${a}</div></div>`;
const trow=t=>{const c=CATS[t.cat]||CATS.self,p=PRI[t.pri||'mid'];return `<div class="tr ${t.status=='done'?'dn':''}"><button class="ck" onclick="A.tog('${t.id}',this)" aria-label="إنجاز">${t.status=='done'?'✓':''}</button><div class="tb" onclick="A.open('task','${t.id}')" draggable="true" ondragstart="A.drag(event,'${t.id}')"><b>${esc(t.title)}</b><small><span class="dot" style="background:${c[1]}"></span>${c[0]}${t.time?' · '+t.time:''}${t.dur?' · '+t.dur+' د':''}${t.due?' · الموعد '+L(pd(t.due),{day:'numeric',month:'short'}):''}</small></div><span class="bd" style="--c:${p[1]}">${p[0]}</span></div>`};
const gcard=g=>{const p=gP(g);return `<div class="gc" onclick="A.open('goal','${g.id}')"><small>${{year:'سنوي',month:'شهري',week:'أسبوعي'}[g.level]}</small><b>${esc(g.title)}</b>${bar(p,(CATS[g.cat]||CATS.self)[1])}<small>${Math.round(p*100)}%</small></div>`};
const gl=(lv,d)=>{const gs=D.goals.filter(g=>inPer(g,lv,d)),nx={year:'month',month:'week'}[lv];return `<div class="cd"><div class="rw"><h3>أهداف ${{year:'السنة',month:'الشهر',week:'الأسبوع'}[lv]}</h3><button class="gb" onclick="A.open('goal','',{level:'${lv}',date:'${ymd(d)}'})">+ هدف</button></div>${gs.length?gs.map(g=>gcard(g)+D.goals.filter(x=>x.parent==g.id).map(k=>`<div class="kid" onclick="A.open('goal','${k.id}')">↳ ${esc(k.title)} <small>${Math.round(gP(k)*100)}%</small></div>`).join('')+(nx?`<button class="lk" onclick="A.open('goal','',{level:'${nx}',parent:'${g.id}',cat:'${g.cat}',date:'${ymd(d)}'})">+ هدف ${nx=='month'?'شهري':'أسبوعي'} فرعي</button> `:'')+`<button class="lk" onclick="A.open('task','',{goal:'${g.id}'})">+ مهمة للهدف</button>`).join(''):'<p class="em">لا أهداف بعد. أضف هدفًا ثم قسّمه إلى أهداف أصغر ومهام.</p>'}</div>`};
/* pages */
const PL={
year(d){const y=d.getFullYear(),all=D.tasks.filter(t=>(t.date||t.due||'').startsWith(y+'-')),dn=all.filter(t=>!open(t)).length;
const ms=[...Array(12)].map((_,m)=>{const x=D.tasks.filter(t=>inM(t,y,m)),k=x.filter(t=>!open(t)).length,mg=D.goals.filter(g=>inPer(g,'month',new Date(y,m,1))).length;return `<div class="cd" style="cursor:pointer" onclick="A.jump(${y},${m})"><b>${L(new Date(y,m,1),{month:'long'})}</b>${bar(x.length?k/x.length:0)}<small>${k}/${x.length} مهمة · ${mg} أهداف</small></div>`}).join('');
return `<div class="g2">${gl('year',d)}<div class="cd cen">${ring(all.length?dn/all.length:0,110)}<small>إنجاز ${y} · متأخرة: ${all.filter(late).length}</small></div></div><div class="g3 mt">${ms}</div>`},
month(d){const y=d.getFullYear(),m=d.getMonth(),ts=D.tasks.filter(t=>inM(t,y,m)).sort(byd),bl=D.tasks.filter(late),dn=ts.filter(t=>!open(t)).length,pre=y+'-'+P2(m+1);
const pl=[...D.books.filter(b=>(b.end||'').startsWith(pre)).map(b=>'كتاب: '+b.title+' (حتى '+b.end+')'),...D.lects.filter(l=>(l.date||'').startsWith(pre)).map(l=>'محاضرة: '+l.subj+' – '+l.title)];

mv(n){const d=S.d,v=S.lvl;if(v=='day')S.d=add(d,n);else if(v=='week')S.d=add(d,7*n);else{const k=v=='year'?12*n:n,x=new Date(d.getFullYear(),d.getMonth()+k,1);x.setDate(Math.min(d.getDate(),new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));S.d=x}R()},
jump(y,m){S.d=new Date(y,m,1);S.lvl='month';R(1)},pick(k){S.d=pd(k);S.lvl='day';R(1)},
q(v){S.F.q=v;$('#tl').innerHTML=tlist()},f(k,v){S.F[k]=v;R()},
modal(h){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target==this)A.close()"><div class="sheet">${h}</div></div>`},close(){$('#modal').innerHTML=''},
open(t,id,pre){const it=id?get(t,id):{...DEF[t],...(pre||{})};S.ed={t,id};const T={task:'مهمة',goal:'هدف',book:'كتاب',lect:'محاضرة',proj:'مشروع',skill:'مهارة'}[t];
A.modal(`<h3>${id?'تعديل':'إضافة'} ${T}</h3><div class="form">${SCH[t].map(f=>fld(f,it[f[0]])).join('')}</div><div class="acts"><button class="pb" onclick="A.save()">حفظ</button><button class="gb" onclick="A.close()">إلغاء</button>${id&&t=='task'?`<button class="gb" onclick="A.dup('${id}')">تكرار</button><button class="gb" onclick="A.snooze('${id}')">تأجيل لغد</button>`:''}${id?`<button class="gb rd" onclick="A.del('${t}','${id}')">حذف</button>`:''}</div>`)},
save(){const{t,id}=S.ed,f=SCH[t],old=id?get(t,id):{},it=id?old:{id:uid()},fm=$('.form');
for(const[k,l,ty]of f){let v=fm.querySelector('[name='+k+']').value;if(ty=='num')v=v===''?'':+v;if(ty=='chk'){const ol=old[k]||[];v=v.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({t:s,d:(ol.find(o=>o.t==s)||{}).d||0}))}it[k]=v}
if(!it[f[0][0]]){toast('أدخل '+f[0][1]);return}if(t=='task'&&!it.status)it.status='todo';if(!id)D[COL[t]].push(it);sv();A.close();R();toast('تم الحفظ ✓')},
del(t,id){if(t!='task'&&!confirm('تأكيد الحذف؟'))return;const a=D[COL[t]],i=a.findIndex(x=>x.id==id),x=a.splice(i,1)[0];sv();A.close();R();toast('حُذف العنصر',()=>{a.splice(i,0,x);sv();R()})},
tog(id,b){const t=get('task',id);t.status=t.status=='done'?'todo':'done';if(t.status=='done'){t.doneAt=today();t.subs=(t.subs||[]).map(s=>({...s,d:1}));toast('أحسنت، أُنجزت المهمة ✓');if(t.rep){const n={...t,id:uid(),status:'todo',doneAt:'',subs:(t.subs||[]).map(s=>({...s,d:0})),date:ymd(add(pd(t.date||today()),+t.rep))};if(t.due)n.due=ymd(add(pd(t.due),+t.rep));D.tasks.push(n)}}sv();b.classList.add('pop');setTimeout(R,260)},
dup(id){const t={...get('task',id),id:uid(),status:'todo',title:get('task',id).title+' (نسخة)'};D.tasks.push(t);sv();A.close();R();toast('تم التكرار')},
snooze(id){const t=get('task',id);t.date=ymd(add(pd(t.date||today()),1));sv();A.close();R();toast('أُجلت إلى الغد')},
drag(e,id){e.dataTransfer.setData('text/plain',id)},drop(e,k){e.preventDefault();const t=get('task',e.dataTransfer.getData('text/plain'));if(t){t.date=k;sv();R();toast('نُقلت المهمة')}},
sub(t,id,i){const x=get(t,id);x.subs[i].d=x.subs[i].d?0:1;sv();R()},note(k,v){D.notes[k]=v;sv();toast('حُفظت الملاحظة')},
resched(k){const n=ymd(add(pd(k),1));D.tasks.forEach(t=>{if((t.date==k||(!t.date&&t.due==k))&&open(t))t.date=n});sv();R();toast('نُقلت المهام غير المكتملة إلى الغد')},
cur(id,v){const b=get('book',id);b.cur=+v||0;if(+b.pages&&b.cur>=b.pages)b.st='done';else if(b.st=='want'&&b.cur>0)b.st='now';sv();R()},
sessions(id){const l=get('lect',id),b=pd(l.date||today()),mk=(n,d,u)=>D.tasks.push({id:uid(),title:n+': '+l.subj+' – '+l.title,cat:'study',pri:l.diff=='3'?'high':'mid',date:ymd(add(b,d)),dur:u,status:'todo',subs:[]});
[1,2,3].forEach((i,j)=>mk('دراسة (جلسة '+i+')',j,25));mk('مراجعة',5,20);mk('مراجعة ثانية',10,20);if(!l.rdate)l.rdate=ymd(add(b,5));sv();R();toast('أُضيفت 3 جلسات ومراجعتان إلى مهامك')},
smart(){const cap=D.set.cap||360,over=D.tasks.filter(late).sort((a,b)=>score(b)-score(a));if(!over.length)return toast('لا توجد مهام متأخرة');const ld={};D.tasks.forEach(t=>{if(open(t)&&t.date>=today())ld[t.date]=(ld[t.date]||0)+(+t.dur||30)});
let d=add(new Date(),1);S.plan=over.map(t=>{const w=+t.dur||30;let n=0;while((ld[ymd(d)]||0)+w>cap&&n++<60)d=add(d,1);const k=ymd(d);ld[k]=(ld[k]||0)+w;return[t.id,k]});
A.modal(`<h3>خطة مقترحة لتوزيع المتأخر</h3><small>لن يتغير شيء قبل موافقتك.</small><div style="margin:10px 0">${S.plan.map(([id,k])=>{const t=get('task',id);return `<div class="tr"><div class="tb"><b>${esc(t.title)}</b><small>${L(pd(k),{weekday:'long',day:'numeric',month:'short'})}${t.due&&k>t.due?' · بعد الموعد النهائي':''}</small></div></div>`}).join('')}</div><div class="acts"><button class="pb" onclick="A.apply()">اعتماد الخطة</button><button class="gb" onclick="A.close()">إلغاء</button></div>`)},
apply(){S.plan.forEach(([id,k])=>get('task',id).date=k);sv();A.close();R();toast('طُبقت الخطة ✓')},
backup(){A.modal(`<h3>نسخ احتياطي واستعادة</h3><small>انسخ النص واحفظه في مكان آمن. للاستعادة، الصق نسخة سابقة هنا أو اختر ملفًا.</small><textarea id="bk" rows="9" style="margin:10px 0;direction:ltr">${esc(JSON.stringify(D))}</textarea><div class="acts"><button class="gb" onclick="$('#bk').select();document.execCommand('copy');toast('نُسخ النص')">نسخ</button><button class="pb" onclick="A.restore($('#bk').value)">استعادة من النص</button><label class="gb" style="padding:8px 15px;border-radius:11px;cursor:pointer">من ملف<input type="file" accept=".json,.txt" hidden onchange="this.files[0]&&this.files[0].text().then(A.restore)"></label></div>`)},
restore(x){try{const j=JSON.parse(x);if(!j.tasks)throw 0;if(!confirm('سيستبدل هذا بياناتك الحالية. متابعة؟'))return;D=Object.assign(D,j);sv();A.close();R();toast('تمت الاستعادة ✓')}catch(e){toast('نص غير صالح')}},
reset(){if(confirm('سيُمسح كل شيء نهائيًا. متابعة؟')&&confirm('تأكيد أخير؟')){try{localStorage.removeItem('nova1')}catch(e){}location.reload()}}};
let tm;function toast(m,u){const e=$('#toast');e.innerHTML=`<div>${m}${u?'<button id="un">تراجع</button>':''}</div>`;if(u)$('#un').onclick=()=>{u();e.innerHTML=''};clearTimeout(tm);tm=setTimeout(()=>e.innerHTML='',u?6000:2200)}
function R(a){const dk=D.set.dark==null?matchMedia('(prefers-color-scheme:dark)').matches:D.set.dark;document.documentElement.dataset.theme=dk?'dark':'light';
$('#nav').innerHTML=NAV.map(n=>`<a class="${S.pg==n[0]?'on':''}" onclick="A.go('${n[0]}')"><i>${n[2]}</i><span>${n[1]}</span></a>`).join('');
const m=$('#main');m.innerHTML=PG[S.pg]();if(a){m.classList.remove('fade');void m.offsetWidth;m.classList.add('fade');scrollTo(0,0)}}
R(1);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
